[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vagus-asistent"
version = "0.1.0"
description = "Vagus Asistent multi-layer AI platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.19",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "starlette>=0.36",
  "httpx>=0.27",
  "typer>=0.9",
  "rich>=13.0",
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "cryptography>=41.0",
  "bcrypt>=4.0",
  "aiogram>=3.0",
  "google-genai>=0.8",
  "psutil>=5.9",
  "playwright>=1.46",
]

[project.scripts]
vagus = "vagus.layer3.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
