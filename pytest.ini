[pytest]
testpaths = tests
pythonpath = src .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    windows: tests that should run on Windows only
    e2e: end-to-end tests requiring real LLM (OPENAI_API_KEY or DEEPSEEK_API_KEY)
    chaos: chaos tests requiring Docker (vagus-redis, vagus-postgres)
