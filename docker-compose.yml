version: "3.9"

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./configs:/app/configs:ro
      - api-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  marketplace:
    build:
      context: .
      target: api
    command:
      - python
      - -m
      - uvicorn
      - src.vagus.plugins.marketplace.api_server:create_marketplace_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    ports:
      - "8010:8010"
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "8501:8501"
    environment:
      - VAGUS_API_URL=http://api:8000
    depends_on:
      - api
      - marketplace
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8020:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      target: telegram
    env_file:
      - .env
    environment:
      - VAGUS_API_URL=http://api:8000
      - VAGUS_API_KEY=${VAGUS_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - telegram

volumes:
  api-data:
  redis-data:
  chroma-data: