version: "3.9"

services:
  # ── Core API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vagus-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vagus}:${POSTGRES_PASSWORD:-vagus}@postgres:5432/${POSTGRES_DB:-vagus}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - api-data:/app/data
    networks:
      - vagus-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vagus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - vagus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vagus-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vagus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vagus}
      POSTGRES_DB: ${POSTGRES_DB:-vagus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vagus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vagus}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Nginx reverse proxy ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: vagus-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - vagus-net

  # ── Streamlit Dashboard ────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vagus-streamlit
    restart: unless-stopped
    command: ["python", "-m", "streamlit", "run", "src/vagus/layer3/dashboard/streamlit_app.py", "--server.port=8501", "--server.headless=true"]
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env.production
    environment:
      - VAGUS_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - vagus-net

  # ── Telegram Bot ───────────────────────────────────────────────────────
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vagus-telegram
    restart: unless-stopped
    command: ["python", "-m", "vagus.layer3.telegram.bot"]
    env_file:
      - .env.production
    environment:
      - VAGUS_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - vagus-net

  # ── Prometheus ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vagus-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - vagus-net

  # ── Grafana ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: vagus-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-vagus}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - vagus-net

volumes:
  api-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  vagus-net:
    driver: bridge
