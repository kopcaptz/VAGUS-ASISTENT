version: "3.9"

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - VAGUS_SECRET_KEY=${VAGUS_SECRET_KEY:-vagus-dev-secret}
    volumes:
      - ./configs:/app/configs:ro
      - api-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "8501:8501"
    environment:
      - VAGUS_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      target: telegram
    env_file:
      - .env
    environment:
      - VAGUS_API_URL=http://api:8000
      - VAGUS_API_KEY=${VAGUS_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - telegram

volumes:
  api-data:
