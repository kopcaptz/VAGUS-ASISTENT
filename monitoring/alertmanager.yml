# Alertmanager configuration for Vagus Asistent
# Replace TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SLACK_WEBHOOK_URL with real values
# Or use envsubst: envsubst < alertmanager.yml.template > alertmanager.yml

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical
      continue: false
    - match:
        severity: warning
      receiver: warning
      continue: false

receivers:
  - name: default
    # No-op when no Telegram/Slack configured

  - name: critical
    # Telegram: set bot_token and chat_id (chat_id as integer, e.g. -1001234567890)
    telegram_configs:
      - send_resolved: true
        bot_token: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
        chat_id: 0
        parse_mode: HTML
        message: "[CRITICAL] {{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}"
    # Slack: uncomment and set api_url to webhook URL
    # slack_configs:
    #   - send_resolved: true
    #     api_url: "https://hooks.slack.com/services/xxx/yyy/zzz"
    #     channel: "#alerts"
    #     title: "Vagus Critical Alert"

  - name: warning
    telegram_configs:
      - send_resolved: true
        bot_token: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
        chat_id: 0
        parse_mode: HTML
        message: "[WARNING] {{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}"
