global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "vagus-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
  - job_name: "vagus-marketplace"
    metrics_path: /metrics
    static_configs:
      - targets:
          - marketplace:9000
