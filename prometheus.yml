global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "vagus-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "vagus-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: "vagus-redis"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
        labels:
          service: "vagus-postgres"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
        labels:
          service: "vagus-nginx"
